<!DOCTYPE html>
<html>
    <head>
        <title> TO DO LIST</title>
        <style>
            #container{
                text-align:center;
                flex-direction:column;
            }
            #body{
                background-color: rgb(86, 4, 75); 
                display:flex;
               justify-content:center;
            align-items:center;
            }
           #title{
         
            font-size: 50px;
            color:rgb(226, 126, 224);
            shadow: 2px 2px 4px #787575;
            font-family:poppins;

           }
           #add{
            
            width:400px;
            height:40px;
            border:3px solid rgb(226, 126, 224);
            border-radius:5px;
            padding:10px;
            font-family:poppins;
           }
           #add-button{
            width:100px;
            height:40px;
            border:3px solid ;
            border-radius:5px;
            background-color:rgb(226, 126, 224);
            color:rgb(249, 247, 249);
            font-family:poppins;
            text-align:center;
            text-decoration:bold;
           }
           #tasks{
            margin-top:30px;
            border:3px solid rgb(46, 36, 45);
            background-color:rgb(226, 126, 224);
            width:600px;
            height:450px;
            overflow-y:wrap;
            border-radius:15px;
           }
        </style>
    </head>
    <body id="body">
        <div id="container">
        <h1 id="title">
            TO DO LIST
        </h1><div id="task-list">
        <input id="add" placeholder="Add a new task" type="text">
        <button id="add-button">Add</button>
        <div id="tasks"></div>
    </div>
        </div>
    <script>
        addButton =document.getElementById("add-button");
        AddInput =document.getElementById("add");
        tasksContainer =document.getElementById("tasks");
        addButton.onclick = function(){
            let label= document.createElement("label");
            let task=add.value;
            label.innerHTML=task;
            tasksContainer.appendChild(label);
            label.style.display = "block";
            
            label.style.marginTop = "10px";
            label.style.fontSize = "20px";
            label.style.color = "rgb(34, 1, 33)";
            label.style.fontFamily = "poppins";
            label.style.textAlign = "left";
            label.style.paddingLeft = "10px";
            label.style.backgroundColor = "rgb(226, 126, 224)";
            label.style.borderRadius = "5px";
            label.style.border = "2px solid rgb(213, 86, 209)";
            let deletebtn=document.createElement("button");
            deletebtn.innerHTML="Delete";
        
            deletebtn.style.cursor="pointer";
            deletebtn.style.padding="5px 10px";
            deletebtn.style.backgroundColor="rgb(86, 4, 75)";
            deletebtn.style.color="rgb(249, 247, 249)";
            deletebtn.style.border="none";
            deletebtn.style.borderRadius="5px";
            deletebtn.style.marginLeft="500px";
            label.appendChild(deletebtn);
            deletebtn.onclick=function(){
                tasksContainer.removeChild(label);
            }
            add.value="";
        };

    </script>

    </body>
</html>
